name: lokshineats_core
description: "Shared foundation for the LokshinEats apps — API client, authentication, theme and common widgets."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The badge the website puts beside the name. Shipped at three resolutions
  # so a 3x phone does not scale a 128px image up.
  assets:
    - assets/logo.png

  # Geist, which is the site's typeface (app/layout.tsx loads it through
  # next/font). Bundled rather than fetched at runtime: the apps are used on
  # mobile data by people paying for it, and a font that arrives late shows
  # every screen in Roboto first.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
        - asset: assets/fonts/Geist-700.ttf
          weight: 700
        - asset: assets/fonts/Geist-800.ttf
          weight: 800
